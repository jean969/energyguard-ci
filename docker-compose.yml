version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres-energyguard
    restart: always
    environment:
      POSTGRES_USER: pierre
      POSTGRES_PASSWORD: energyguard123
      POSTGRES_DB: energyguard_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-energyguard
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: