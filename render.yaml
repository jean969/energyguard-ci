services:
  - type: web
    name: energyguard-ci-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./energyguard.db
      - key: REDIS_URL
        value: ""
      - key: PYTHONIOENCODING
        value: utf-8
